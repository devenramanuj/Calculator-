<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline Ready Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Segoe UI', sans-serif;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }

        /* ડિસ્પ્લે એરિયા */
        #display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hist-btn {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px;
        }

        #status-msg {
            color: #4caf50;
            font-size: 0.8rem;
            font-weight: bold;
        }

        #display {
            width: 100%;
            background-color: transparent;
            border: none;
            color: white;
            font-size: 4rem; 
            text-align: right;
            padding: 0;
            margin: 0;
            font-weight: 300;
            transition: font-size 0.2s;
        }

        /* કીપેડ */
        .buttons {
            flex: 4;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            width: 100%;
            height: 100%;
            font-size: 1.6rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background-color: #333333;
            color: white;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); background-color: #555; }
        
        button.operator { background-color: #ff9f0a; color: white; font-size: 1.8rem; }
        button.clear { background-color: #a5a5a5; color: black; font-weight: 500; }
        
        /* માઈક બટનનું સ્ટાઇલ */
        button.mic-btn { background-color: #ff3b30; color: white; transition: 0.3s; }
        
        /* જ્યારે ઓફલાઇન હોય ત્યારે માઈક આવું દેખાશે */
        button.mic-disabled { background-color: #555 !important; color: #888 !important; cursor: not-allowed; }

        button.equal { background-color: #30d158; color: white; }
        
        /* History Panel */
        #history-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 10;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .hist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 10px;
        }
        .hist-header h2 { margin: 0; color: white; }
        .close-btn { background: none; color: #ff3b30; font-size: 1.5rem; border: none; }
        #history-list { flex: 1; overflow-y: auto; color: #ccc; }
        .hist-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .clear-hist { background-color: #333; color: #ff3b30; margin-top: 10px; height: 40px; border-radius: 10px; border: none;}

        .credit {
            text-align: center;
            padding-top: 8px;
            padding-bottom: 2px;
            color: #666;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .credit a {
            color: #4caf50;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 2px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="calculator">
    
    <div id="display-container">
        <div class="top-bar">
            <button class="hist-btn" onclick="openHistory()">🕒 History</button>
            <div id="status-msg"></div>
        </div>
        <input type="text" id="display" readonly placeholder="0">
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="clear" onclick="deleteLast()">⌫</button>
        <button class="mic-btn" onclick="startListening()" id="mic-btn">🎤</button>
        <button class="operator" onclick="insert('/')">÷</button>
        
        <button onclick="insert('7')">7</button>
        <button onclick="insert('8')">8</button>
        <button onclick="insert('9')">9</button>
        <button class="operator" onclick="insert('*')">×</button>
        
        <button onclick="insert('4')">4</button>
        <button onclick="insert('5')">5</button>
        <button onclick="insert('6')">6</button>
        <button class="operator" onclick="insert('-')">−</button>
        
        <button onclick="insert('1')">1</button>
        <button onclick="insert('2')">2</button>
        <button onclick="insert('3')">3</button>
        <button class="operator" onclick="insert('+')">+</button>
        
        <button style="grid-column: span 2; border-radius: 15px; text-align: left; padding-left: 25px;" onclick="insert('0')">0</button>
        <button onclick="insert('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="credit">
        Developed by Devendra Ramanuj
        <a href="tel:9276505035">📞 9276505035</a>
    </div>

    <div id="history-panel">
        <div class="hist-header">
            <h2>📜 History</h2>
            <button class="close-btn" onclick="closeHistory()">✕</button>
        </div>
        <div id="history-list">
            <div style="text-align: center; color: #555; margin-top: 20px;">No history yet</div>
        </div>
        <button class="clear-hist" onclick="clearHistoryData()">Clear History</button>
    </div>

</div>

<script>
    const display = document.getElementById('display');
    const statusMsg = document.getElementById('status-msg');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');
    const micBtn = document.getElementById('mic-btn');
    let historyData = [];

    // --- Internet Detection ---
    function checkOnlineStatus() {
        if (navigator.onLine) {
            statusMsg.innerText = "Online";
            statusMsg.style.color = "#4caf50";
            micBtn.classList.remove("mic-disabled");
            micBtn.innerText = "🎤";
        } else {
            statusMsg.innerText = "No Internet (Mic Off)";
            statusMsg.style.color = "#ff3b30";
            micBtn.classList.add("mic-disabled");
            micBtn.innerText = "🚫";
        }
    }

    // જ્યારે નેટ આવે કે જાય ત્યારે ઓટોમેટિક અપડેટ થશે
    window.addEventListener('online', checkOnlineStatus);
    window.addEventListener('offline', checkOnlineStatus);
    checkOnlineStatus(); // શરૂઆતમાં ચેક કરો

    // --- Font Resizing ---
    function adjustFontSize() {
        const len = display.value.length;
        if (len > 18) display.style.fontSize = "1.8rem";
        else if (len > 13) display.style.fontSize = "2.5rem";
        else if (len > 9) display.style.fontSize = "3.2rem";
        else display.style.fontSize = "4rem";
    }

    // --- History Functions ---
    function openHistory() {
        historyPanel.style.display = 'flex';
        renderHistory();
    }
    function closeHistory() { historyPanel.style.display = 'none'; }
    function renderHistory() {
        if(historyData.length === 0) {
            historyList.innerHTML = '<div style="text-align: center; color: #555; margin-top: 20px;">No history yet</div>';
            return;
        }
        historyList.innerHTML = '';
        historyData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'hist-item';
            div.innerHTML = `<span>${item.expr}</span> <span>= ${item.res}</span>`;
            historyList.prepend(div); 
        });
    }
    function clearHistoryData() {
        historyData = [];
        renderHistory();
    }

    // --- Calculator Logic ---
    function insert(num) {
        if(display.value === "0" && num !== ".") display.value = "";
        display.value += num;
        adjustFontSize();
    }
    function clearDisplay() {
        display.value = "";
        display.placeholder = "0";
        adjustFontSize();
    }
    function deleteLast() {
        display.value = display.value.toString().slice(0, -1);
        if(display.value === "") display.placeholder = "0";
        adjustFontSize();
    }
    function calculate() {
        try {
            if(display.value === "") return;
            let expression = display.value;
            let result = eval(expression);
            if (!Number.isInteger(result)) result = parseFloat(result.toFixed(4));
            
            historyData.push({ expr: expression, res: result });
            display.value = result;
            adjustFontSize();
            
            // જો ઓફલાઇન હોય તો બોલવાનો પ્રયત્ન કરશે, 
            // પણ જો અવાજની ફાઈલ નહીં હોય તો નહીં બોલે.
            speak(result);
        } catch (error) {
            display.value = "Error";
        }
    }

        // --- Voice Input (Continuous Mode) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isMicOn = false; // માઈક ચાલુ છે કે બંધ તે ચેક કરવા માટે

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'gu-IN'; 
        
        // ફેરફાર 1: continuous true કર્યું જેથી માઈક ચાલુ રહે
        recognition.continuous = true; 
        recognition.interimResults = false; // ફાઈનલ રિઝલ્ટ જ લેશે

        recognition.onstart = () => { 
            statusMsg.innerText = "Listening (Always On)..."; 
            micBtn.style.backgroundColor = "#30d158"; // લીલો કલર (ચાલુ)
            micBtn.classList.add("listening-mode");
        };

        recognition.onend = () => { 
            // ફેરફાર 2: જો આપણે જાતે બંધ નથી કર્યું, તો તે ફરીથી આપમેળે શરૂ થશે
            if (isMicOn && navigator.onLine) {
                recognition.start(); 
            } else {
                statusMsg.innerText = navigator.onLine ? "Online" : "Offline";
                micBtn.style.backgroundColor = "#ff3b30"; // લાલ કલર (બંધ)
                micBtn.classList.remove("listening-mode");
                isMicOn = false;
            }
        };

        recognition.onresult = (event) => {
            // છેલ્લું જે વાક્ય બોલાયું હોય તે લેશે
            const lastIndex = event.results.length - 1;
            const transcript = event.results[lastIndex][0].transcript.toLowerCase();
            processVoice(transcript);
        };
        
        recognition.onerror = (event) => {
            console.log("Voice Error:", event.error);
            // જો કઈ એરર આવે તો પણ ફરીથી ટ્રાય કરશે (જો ચાલુ હોય તો)
            if(event.error === 'no-speech' && isMicOn) {
                // Ignore silence errors
            } else {
                // અન્ય એરર હોય તો થોડી વાર રોકાઈને ચાલુ થશે
            }
        };
    }

    // ફેરફાર 3: બટન દબાવવાથી હવે ON/OFF થશે (Toggle)
    function startListening() {
        if (!navigator.onLine) {
            alert("માઈક વાપરવા માટે ઇન્ટરનેટ જરૂરી છે.");
            return;
        }

        if (!recognition) {
            alert("તમારા બ્રાઉઝરમાં વોઈસ ફીચર નથી.");
            return;
        }

        if (isMicOn) {
            // જો ચાલુ હોય તો બંધ કરો
            isMicOn = false;
            recognition.stop();
            micBtn.innerText = "🎤";
        } else {
            // જો બંધ હોય તો ચાલુ કરો
            isMicOn = true;
            recognition.start();
            micBtn.innerText = "⏹️"; // Stop icon
        }
    }

    function processVoice(text) {
        let cleanText = text;
        const mapObj = {
            'વત્તા':'+', 'plus':'+', 'સરવાળો':'+', 'ઉમેરો': '+',
            'ઓછા':'-', 'minus':'-', 'બાદ':'-',
            'ગુણ્યા':'*', 'into':'*', 'x':'*',
            'ભાગ્યા':'/', 'divided':'/', 'ભાગાકાર':'/',
            'એક':'1', 'બે':'2', 'ત્રણ':'3', 'ચાર':'4', 'પાંચ':'5', 
            'છ':'6', 'સાત':'7', 'આઠ':'8', 'નવ':'9', 'શૂન્ય':'0'
        };
        for (let key in mapObj) {
            cleanText = cleanText.replace(new RegExp(key, "g"), mapObj[key]);
        }
        
        // અવાજમાં 'ક્લિયર' બોલે તો સ્ક્રીન સાફ થાય
        if (cleanText.includes("clear") || cleanText.includes("સાફ")) {
            clearDisplay();
            return;
        }

        const mathChars = cleanText.replace(/[^0-9+\-*/.%]/g, '');
        
        if(mathChars.length > 0) {
            display.value = mathChars;
            adjustFontSize();
            
            // 1 સેકન્ડ પછી રિઝલ્ટ આવશે, પણ માઈક બંધ નહિ થાય
            setTimeout(() => {
                calculate();
                // બોલ્યા પછી રિઝલ્ટ બોલશે (Speak function જૂનું જ રહેશે)
            }, 1000);
        }
    }


    // --- Speech Output ---
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'gu-IN';
            // ઓફલાઇન હોય તો પણ હિન્દી અવાજ (જે ફોનમાં સ્ટોર હોય) ટ્રાય કરશે
            utterance.onerror = () => {
                 utterance.lang = 'hi-IN';
                 window.speechSynthesis.speak(utterance);
            };
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
