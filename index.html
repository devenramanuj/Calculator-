<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Calculator (Continuous)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Segoe UI', sans-serif;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* Mobile tap color remove */
        }

        .calculator {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
        }

        /* ડિસ્પ્લે એરિયા */
        #display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hist-btn {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px;
        }

        #status-msg {
            color: #4caf50;
            font-size: 0.8rem;
            font-weight: bold;
        }

        #display {
            width: 100%;
            background-color: transparent;
            border: none;
            color: white;
            font-size: 4rem; 
            text-align: right;
            padding: 0;
            margin: 0;
            font-weight: 300;
            transition: font-size 0.2s;
        }

        /* કીપેડ */
        .buttons {
            flex: 4;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            width: 100%;
            height: 100%;
            font-size: 1.6rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background-color: #333333;
            color: white;
            transition: transform 0.1s;
            user-select: none;
        }
        button:active { transform: scale(0.95); background-color: #555; }
        
        button.operator { background-color: #ff9f0a; color: white; font-size: 1.8rem; }
        button.clear { background-color: #a5a5a5; color: black; font-weight: 500; }
        
        /* માઈક બટનનું સ્ટાઇલ */
        button.mic-btn { background-color: #ff3b30; color: white; transition: 0.3s; }
        
        /* જ્યારે માઈક ચાલુ હોય (Listening Mode) */
        button.mic-active { 
            background-color: #30d158 !important; 
            animation: pulse 1.5s infinite;
        }
        
        /* જ્યારે ઓફલાઇન હોય ત્યારે માઈક */
        button.mic-disabled { background-color: #555 !important; color: #888 !important; cursor: not-allowed; }

        button.equal { background-color: #30d158; color: white; }
        
        /* Pulse Animation for Mic */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(48, 209, 88, 0); }
            100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
        }

        /* History Panel */
        #history-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 10;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .hist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 10px;
        }
        .hist-header h2 { margin: 0; color: white; }
        .close-btn { background: none; color: #ff3b30; font-size: 1.5rem; border: none; }
        #history-list { flex: 1; overflow-y: auto; color: #ccc; }
        .hist-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .clear-hist { background-color: #333; color: #ff3b30; margin-top: 10px; height: 40px; border-radius: 10px; border: none;}

        .credit {
            text-align: center;
            padding-top: 8px;
            padding-bottom: 2px;
            color: #666;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .credit a {
            color: #4caf50;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 2px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="calculator">
    
    <div id="display-container">
        <div class="top-bar">
            <button class="hist-btn" onclick="openHistory()">🕒 History</button>
            <div id="status-msg"></div>
        </div>
        <input type="text" id="display" readonly placeholder="0">
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="clear" onclick="deleteLast()">⌫</button>
        <button class="mic-btn" onclick="toggleMic()" id="mic-btn">🎤</button>
        <button class="operator" onclick="insert('/')">÷</button>
        
        <button onclick="insert('7')">7</button>
        <button onclick="insert('8')">8</button>
        <button onclick="insert('9')">9</button>
        <button class="operator" onclick="insert('*')">×</button>
        
        <button onclick="insert('4')">4</button>
        <button onclick="insert('5')">5</button>
        <button onclick="insert('6')">6</button>
        <button class="operator" onclick="insert('-')">−</button>
        
        <button onclick="insert('1')">1</button>
        <button onclick="insert('2')">2</button>
        <button onclick="insert('3')">3</button>
        <button class="operator" onclick="insert('+')">+</button>
        
        <button style="grid-column: span 2; border-radius: 15px; text-align: left; padding-left: 25px;" onclick="insert('0')">0</button>
        <button onclick="insert('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="credit">
        Developed by Devendra Ramanuj
        <a href="tel:9276505035">📞 9276505035</a>
    </div>

    <div id="history-panel">
        <div class="hist-header">
            <h2>📜 History</h2>
            <button class="close-btn" onclick="closeHistory()">✕</button>
        </div>
        <div id="history-list">
            <div style="text-align: center; color: #555; margin-top: 20px;">No history yet</div>
        </div>
        <button class="clear-hist" onclick="clearHistoryData()">Clear History</button>
    </div>

</div>

<script>
    const display = document.getElementById('display');
    const statusMsg = document.getElementById('status-msg');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');
    const micBtn = document.getElementById('mic-btn');
    let historyData = [];

    // --- Internet Detection ---
    function checkOnlineStatus() {
        if (navigator.onLine) {
            if(!isMicOn) {
                statusMsg.innerText = "Online";
                statusMsg.style.color = "#4caf50";
            }
            micBtn.classList.remove("mic-disabled");
            if(!isMicOn) micBtn.innerText = "🎤";
        } else {
            statusMsg.innerText = "No Internet (Mic Off)";
            statusMsg.style.color = "#ff3b30";
            micBtn.classList.add("mic-disabled");
            micBtn.innerText = "🚫";
            // જો નેટ જાય તો માઈક બંધ કરવું
            if(isMicOn) toggleMic(); 
        }
    }

    window.addEventListener('online', checkOnlineStatus);
    window.addEventListener('offline', checkOnlineStatus);
    checkOnlineStatus(); 

    // --- Font Resizing ---
    function adjustFontSize() {
        const len = display.value.length;
        if (len > 18) display.style.fontSize = "1.8rem";
        else if (len > 13) display.style.fontSize = "2.5rem";
        else if (len > 9) display.style.fontSize = "3.2rem";
        else display.style.fontSize = "4rem";
    }

    // --- History Functions ---
    function openHistory() {
        historyPanel.style.display = 'flex';
        renderHistory();
    }
    function closeHistory() { historyPanel.style.display = 'none'; }
    function renderHistory() {
        if(historyData.length === 0) {
            historyList.innerHTML = '<div style="text-align: center; color: #555; margin-top: 20px;">No history yet</div>';
            return;
        }
        historyList.innerHTML = '';
        historyData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'hist-item';
            div.innerHTML = `<span>${item.expr}</span> <span>= ${item.res}</span>`;
            historyList.prepend(div); 
        });
    }
    function clearHistoryData() {
        historyData = [];
        renderHistory();
    }

    // --- Calculator Logic ---
    function insert(num) {
        if(display.value === "0" && num !== ".") display.value = "";
        display.value += num;
        adjustFontSize();
    }
    function clearDisplay() {
        display.value = "";
        display.placeholder = "0";
        adjustFontSize();
    }
    function deleteLast() {
        display.value = display.value.toString().slice(0, -1);
        if(display.value === "") display.placeholder = "0";
        adjustFontSize();
    }
    function calculate() {
        try {
            if(display.value === "") return;
            let expression = display.value;
            // સુરક્ષા માટે eval ને બદલે Function વાપરવું વધુ સારું પણ હાલ સરળતા માટે eval
            let result = eval(expression);
            if (!Number.isInteger(result)) result = parseFloat(result.toFixed(4));
            
            historyData.push({ expr: expression, res: result });
            display.value = result;
            adjustFontSize();
            
            speak(result);
        } catch (error) {
            display.value = "Error";
            setTimeout(clearDisplay, 1500);
        }
    }

    // --- CONTINUOUS VOICE INPUT LOGIC ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isMicOn = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'gu-IN'; 
        recognition.continuous = true; // સતત ચાલુ રહેશે
        recognition.interimResults = false;

        recognition.onstart = () => { 
            statusMsg.innerText = "Listening..."; 
            statusMsg.style.color = "#30d158";
            micBtn.classList.add("mic-active");
            micBtn.innerText = "⏹️"; // Stop Icon
        };

        recognition.onend = () => { 
            // જો યુઝરે બંધ નથી કર્યું તો ફરી ચાલુ કરો (Auto Restart)
            if (isMicOn && navigator.onLine) {
                try { recognition.start(); } catch(e) {}
            } else {
                // ખરેખર બંધ થયું
                statusMsg.innerText = "Online";
                statusMsg.style.color = "#4caf50";
                micBtn.classList.remove("mic-active");
                micBtn.innerText = "🎤";
                isMicOn = false;
            }
        };

        recognition.onresult = (event) => {
            const lastIndex = event.results.length - 1;
            const transcript = event.results[lastIndex][0].transcript.toLowerCase();
            processVoice(transcript);
        };
        
        recognition.onerror = (event) => {
            console.log("Error:", event.error);
            if(event.error === 'no-speech') { /* Ignore silence */ }
        };
    }

    function toggleMic() {
        if (!navigator.onLine) {
            alert("ઇન્ટરનેટ કનેક્શન નથી.");
            return;
        }
        if (!recognition) {
            alert("આ બ્રાઉઝરમાં વોઈસ સપોર્ટ નથી.");
            return;
        }

        if (isMicOn) {
            // Stop Listening
            isMicOn = false;
            recognition.stop();
        } else {
            // Start Listening
            isMicOn = true;
            recognition.start();
        }
    }

    function processVoice(text) {
        let cleanText = text;
        
        // ક્લિયર કમાન્ડ
        if (cleanText.includes("clear") || cleanText.includes("સાફ") || cleanText.includes("ભૂંસી")) {
            clearDisplay();
            return;
        }

        const mapObj = {
            'વત્તા':'+', 'plus':'+', 'સરવાળો':'+', 'ઉમેરો': '+',
            'ઓછા':'-', 'minus':'-', 'બાદ':'-',
            'ગુણ્યા':'*', 'into':'*', 'x':'*', 'મલ્ટીપ્લાય':'*',
            'ભાગ્યા':'/', 'divided':'/', 'ભાગાકાર':'/', 'ડિવાઇડ':'/',
            'એક':'1', 'બે':'2', 'ત્રણ':'3', 'ચાર':'4', 'પાંચ':'5', 
            'છ':'6', 'સાત':'7', 'આઠ':'8', 'નવ':'9', 'શૂન્ય':'0', 'ઝીરો':'0'
        };
        
        for (let key in mapObj) {
            cleanText = cleanText.replace(new RegExp(key, "g"), mapObj[key]);
        }
        
        const mathChars = cleanText.replace(/[^0-9+\-*/.%]/g, '');
        
        if(mathChars.length > 0) {
            // જો અગાઉ કોઈ આંકડો હોય અને નવું ઇનપુટ નિશાની (+,-,*,/) થી શરૂ થાય તો જોઈન્ટ કરો
            if (display.value !== "" && display.value !== "0" && ['+','-','*','/'].includes(mathChars[0])) {
                 display.value += mathChars;
            } else {
                 // નહિતર નવેસરથી લખો
                 display.value = mathChars;
            }
            
            adjustFontSize();
            
            // 1 સેકન્ડ પછી ઓટોમેટિક કેલ્ક્યુલેટ થશે
            setTimeout(() => {
                // હજુ પણ જો કંઇક લખેલું હોય તો જ ગણતરી કરો
                if(display.value.length > 0) calculate();
            }, 1200);
        }
    }

    // --- Speech Output ---
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // જૂનું બોલવાનું અટકાવો
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'gu-IN';
            utterance.rate = 1; // ઝડપ
            utterance.onerror = () => {
                 utterance.lang = 'hi-IN';
                 window.speechSynthesis.speak(utterance);
            };
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
