<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .calculator-card { background: white; width: 100%; max-width: 400px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); padding: 25px; text-align: center; border: 2px solid #ff9800; }
        .app-name { font-size: 24px; color: #ff9800; font-weight: bold; margin-bottom: 15px; }
        .display { width: 100%; height: 70px; background: #222; color: #00ff00; border-radius: 12px; margin-bottom: 20px; text-align: right; padding: 15px; font-size: 32px; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        
        button { padding: 20px; font-size: 24px; border: none; border-radius: 15px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .num-btn { background: #f8f9fa; color: #333; border: 1px solid #ddd; }
        .num-btn:active { background: #e2e6ea; }
        
        /* મોટા અને રંગીન ઓપરેટર બટન્સ */
        .op-btn { background: #ff9800; color: white; font-size: 28px; }
        .op-btn:active { background: #e68a00; }
        
        .voice-btn { background: #4caf50; color: white; grid-column: span 4; font-size: 20px; margin-bottom: 10px; }
        .clear-btn { background: #f44336; color: white; }
        
        .history-section { margin-top: 20px; text-align: left; border-top: 2px solid #eee; padding-top: 15px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .history-list { max-height: 120px; overflow-y: auto; font-size: 16px; color: #555; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        
        .h-clear { background: #777; color: white; font-size: 14px; padding: 5px 10px; border-radius: 5px; }
        
        .credit { margin-top: 20px; font-size: 14px; color: #444; font-weight: bold; border-top: 1px solid #eee; padding-top: 15px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="app-name">@ Dev Calculator</div>
    
    <div class="display" id="display">0</div>
    
    <button class="voice-btn" onclick="startVoice()">🎤 બોલીને ગણતરી કરો</button>
    
    <div class="btn-grid">
        <button class="clear-btn" onclick="clearDisplay()">C</button>
        <button class="op-btn" onclick="appendToDisplay('/')">÷</button>
        <button class="op-btn" onclick="appendToDisplay('*')">×</button>
        <button class="op-btn" onclick="deleteLast()">⌫</button>
        
        <button class="num-btn" onclick="appendToDisplay('7')">7</button>
        <button class="num-btn" onclick="appendToDisplay('8')">8</button>
        <button class="num-btn" onclick="appendToDisplay('9')">9</button>
        <button class="op-btn" onclick="appendToDisplay('-')">−</button>
        
        <button class="num-btn" onclick="appendToDisplay('4')">4</button>
        <button class="num-btn" onclick="appendToDisplay('5')">5</button>
        <button class="num-btn" onclick="appendToDisplay('6')">6</button>
        <button class="op-btn" onclick="appendToDisplay('+')">+</button>
        
        <button class="num-btn" onclick="appendToDisplay('1')">1</button>
        <button class="num-btn" onclick="appendToDisplay('2')">2</button>
        <button class="num-btn" onclick="appendToDisplay('3')">3</button>
        <button class="op-btn" style="background: #2196F3;" onclick="calculate()">=</button>
        
        <button class="num-btn" style="grid-column: span 2;" onclick="appendToDisplay('0')">0</button>
        <button class="num-btn" onclick="appendToDisplay('.')">.</button>
        <button class="op-btn" onclick="appendToDisplay('%')">%</button>
    </div>

    <div class="history-section">
        <div class="history-header">
            <strong>હિસ્ટ્રી</strong>
            <button class="h-clear" onclick="clearHistory()">Clear History</button>
        </div>
        <div class="history-list" id="history"></div>
    </div>

    <div class="credit">
        Developed by Devendra Ramanuj<br>
        📞 9276505035
    </div>
</div>

<script>
    const display = document.getElementById('display');
    const historyDiv = document.getElementById('history');

    function appendToDisplay(value) {
        if (display.innerText === '0' && value !== '.') display.innerText = value;
        else display.innerText += value;
    }

    function clearDisplay() { display.innerText = '0'; }

    function deleteLast() {
        if (display.innerText.length > 1) {
            display.innerText = display.innerText.slice(0, -1);
        } else {
            display.innerText = '0';
        }
    }

    function calculate() {
        try {
            let expression = display.innerText;
            const result = eval(expression.replace(/×/g, '*').replace(/÷/g, '/'));
            addHistory(expression + " = " + result);
            display.innerText = result;
        } catch (e) {
            display.innerText = "Error";
        }
    }

    function addHistory(text) {
        const entry = document.createElement('div');
        entry.style.padding = "5px 0";
        entry.style.borderBottom = "1px solid #ddd";
        entry.innerText = "• " + text;
        historyDiv.prepend(entry);
    }

    function clearHistory() {
        historyDiv.innerHTML = "";
    }

    // Voice Functionality
    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'gu-IN';

        recognition.onstart = () => { display.innerText = "સાંભળી રહ્યો છું..."; };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            processCommand(transcript);
        };

        recognition.onerror = () => {
            display.innerText = "Error";
            speak("ફરી પ્રયત્ન કરો");
        };

        recognition.start();
    }

    function processCommand(cmd) {
        // Regex to extract numbers for interest calculation
        const numbers = cmd.match(/\d+/g);
        
        if (numbers && numbers.length >= 3) {
            const p = parseFloat(numbers[0]);
            const r = parseFloat(numbers[1]);
            const t = parseFloat(numbers[2]);
            const interest = (p * r * t) / 100;
            
            const msg = `${p} નું ${r}% લેખે ${t} વર્ષનું વ્યાજ ${interest} થાય`;
            display.innerText = interest;
            addHistory(msg);
            speak(msg);
        } else {
            display.innerText = "સમજાયું નહીં";
            speak("ક્ષમા કરશો મને સમજાયું નથી");
        }
    }

    function speak(text) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'hi-IN'; 
        synth.speak(utter);
    }
</script>

</body>
</html>
