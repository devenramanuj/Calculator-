<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .calculator {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* ડિસ્પ્લે એરિયા */
        #display-container {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* હિસ્ટ્રી બટન અને અંકો વચ્ચે જગ્યા */
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* હિસ્ટ્રી બટન */
        .hist-btn {
            background: none;
            border: none;
            color: #ff9f0a;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }

        #status-msg {
            color: #4caf50;
            font-size: 0.9rem;
        }

        #display {
            width: 100%;
            background-color: transparent;
            border: none;
            color: white;
            font-size: 4rem;
            text-align: right;
            padding: 0;
            margin: 0;
            font-weight: 300;
        }

        /* કીપેડ */
        .buttons {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            width: 100%;
            height: 100%;
            font-size: 1.8rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: #333333;
            color: white;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.90); background-color: #555; }
        
        button.operator { background-color: #ff9f0a; color: white; font-size: 2rem; }
        button.clear { background-color: #a5a5a5; color: black; font-weight: 500; }
        button.mic-btn { background-color: #ff3b30; color: white; }
        button.equal { background-color: #30d158; color: white; }
        
        /* હિસ્ટ્રી પેનલ (ઓવરલે) */
        #history-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 10;
            display: none; /* શરૂઆતમાં બંધ રહેશે */
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .hist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 10px;
        }

        .hist-header h2 { margin: 0; color: white; font-size: 1.5rem; }
        .close-btn { background: none; color: #ff3b30; font-size: 1.5rem; width: auto; height: auto; }

        #history-list {
            flex: 1;
            overflow-y: auto;
            color: #ccc;
        }

        .hist-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #222;
            font-size: 1.2rem;
        }
        .hist-item span:last-child { color: #4caf50; font-weight: bold; }

        .clear-hist {
            background-color: #333;
            color: #ff3b30;
            margin-top: 10px;
            height: 50px;
            font-size: 1rem;
            border-radius: 10px;
        }

        .credit {
            text-align: center;
            padding-top: 15px;
            padding-bottom: 5px;
            color: #666;
            font-size: 0.85rem;
        }
        .credit a {
            color: #4caf50;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 5px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="calculator">
    
    <div id="display-container">
        <div class="top-bar">
            <button class="hist-btn" onclick="openHistory()">🕒 History</button>
            <div id="status-msg"></div>
        </div>
        <input type="text" id="display" readonly placeholder="0">
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="clear" onclick="deleteLast()">⌫</button>
        <button class="mic-btn" onclick="startListening()" id="mic-btn">🎤</button>
        <button class="operator" onclick="insert('/')">÷</button>
        
        <button onclick="insert('7')">7</button>
        <button onclick="insert('8')">8</button>
        <button onclick="insert('9')">9</button>
        <button class="operator" onclick="insert('*')">×</button>
        
        <button onclick="insert('4')">4</button>
        <button onclick="insert('5')">5</button>
        <button onclick="insert('6')">6</button>
        <button class="operator" onclick="insert('-')">−</button>
        
        <button onclick="insert('1')">1</button>
        <button onclick="insert('2')">2</button>
        <button onclick="insert('3')">3</button>
        <button class="operator" onclick="insert('+')">+</button>
        
        <button style="grid-column: span 2; border-radius: 40px; text-align: left; padding-left: 35px;" onclick="insert('0')">0</button>
        <button onclick="insert('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="credit">
        Developed by Devendra Ramanuj
        <a href="tel:9276505035">📞 9276505035</a>
    </div>

    <div id="history-panel">
        <div class="hist-header">
            <h2>📜 History</h2>
            <button class="close-btn" onclick="closeHistory()">✕</button>
        </div>
        <div id="history-list">
            <div style="text-align: center; color: #555; margin-top: 20px;">No history yet</div>
        </div>
        <button class="clear-hist" onclick="clearHistoryData()">Clear History</button>
    </div>

</div>

<script>
    const display = document.getElementById('display');
    const statusMsg = document.getElementById('status-msg');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');
    let historyData = [];

    // --- History Functions ---
    function openHistory() {
        historyPanel.style.display = 'flex';
        renderHistory();
    }

    function closeHistory() {
        historyPanel.style.display = 'none';
    }

    function renderHistory() {
        if(historyData.length === 0) {
            historyList.innerHTML = '<div style="text-align: center; color: #555; margin-top: 20px;">No history yet</div>';
            return;
        }
        historyList.innerHTML = '';
        historyData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'hist-item';
            div.innerHTML = `<span>${item.expr}</span> <span>= ${item.res}</span>`;
            historyList.prepend(div); // Newest first
        });
    }

    function clearHistoryData() {
        historyData = [];
        renderHistory();
    }

    // --- Calculator Logic ---
    function insert(num) {
        if(display.value === "0" && num !== ".") display.value = "";
        display.value += num;
    }

    function clearDisplay() {
        display.value = "";
        display.placeholder = "0";
    }

    function deleteLast() {
        display.value = display.value.toString().slice(0, -1);
        if(display.value === "") display.placeholder = "0";
    }

    function calculate() {
        try {
            if(display.value === "") return;
            let expression = display.value;
            let result = eval(expression);
            
            if (!Number.isInteger(result)) {
                result = parseFloat(result.toFixed(4));
            }

            // હિસ્ટ્રીમાં ઉમેરો
            historyData.push({ expr: expression, res: result });

            display.value = result;
            
            speak(result);
        } catch (error) {
            display.value = "Error";
        }
    }

    // --- Voice Logic (Mic) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'gu-IN'; 
        recognition.continuous = false;

        recognition.onstart = () => { statusMsg.innerText = "Listening..."; };
        recognition.onend = () => { statusMsg.innerText = ""; };
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            processVoice(transcript);
        };
    }

    function startListening() {
        if (recognition) recognition.start();
        else alert("Voice input needs Chrome browser.");
    }

    function processVoice(text) {
        let cleanText = text;
        
        // Replacements for Gujarati
        const mapObj = {
            'વત્તા':'+', 'plus':'+', 'સરવાળો':'+',
            'ઓછા':'-', 'minus':'-', 'બાદ':'-',
            'ગુણ્યા':'*', 'into':'*', 'x':'*',
            'ભાગ્યા':'/', 'divided':'/',
            'એક':'1', 'બે':'2', 'ત્રણ':'3', 'ચાર':'4', 'પાંચ':'5', 
            'છ':'6', 'સાત':'7', 'આઠ':'8', 'નવ':'9', 'શૂન્ય':'0'
        };

        for (let key in mapObj) {
            cleanText = cleanText.replace(new RegExp(key, "g"), mapObj[key]);
        }

        const mathChars = cleanText.replace(/[^0-9+\-*/.%]/g, '');
        if(mathChars.length > 0) {
            display.value = mathChars;
            setTimeout(calculate, 1000);
        }
    }

    // --- Speech Output ---
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'gu-IN';
            utterance.onerror = () => {
                 utterance.lang = 'hi-IN'; // Fallback
                 window.speechSynthesis.speak(utterance);
            };
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
